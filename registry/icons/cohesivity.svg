  <polygon points="22,24 78,24 70,40 14,40" fill="#f7f6f2"/>
  <polygon points="28,44 84,44 76,60 20,60" fill="#8a8a8a"/>
  <polygon points="22,64 78,64 70,80 14,80" fill="#f7f6f2"/>
