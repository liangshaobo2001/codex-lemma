function content(item){

  if(item.type==='reasoning')return [...(item.summary||[]),...(item.content||[])].join('\n\n');

function entryKey(entry,index){const item=entry.item||entry;return (entry.turnId||'unknown')+':'+(item.id||index)}

function renderLive(){
  $('live').replaceChildren();if(viewingOlder||!thread)return;

function render(items){
  const root=$('history'),valid=new Set();let group=[];
  const flush=()=>{if(group.length){root.append(activityGroup(group));group=[]}};
  for(let index=0;index<items.length;index++){
    const entry=items[index],item=entry.item||entry,key=entryKey(entry,index);
    if(item.type!=='userMessage'&&item.type!=='agentMessage'){
      if(group.length&&group[0].entry.turnId!==entry.turnId)flush();

    }

    if(live){if(text.length>=live.text.length)liveMessages.delete(item.id);else text=live.text}
    if(!text)continue;
    const node=messageNode(item.type==='userMessage'?'user':'assistant',text,item.id);

async function approvals(){if(!thread)return;const selected=thread.id;const result=await api('/api/pending');if(thread?.id!==selected)return;const pending=result.filter(r=>r.params.threadId===thread.id);const stamp=JSON.stringify(pending);if(stamp===lastPending)return;lastPending=stamp;$('approvals').replaceChildren();for(const r of pending){const card=el('article');card.append(el('h3','需要你的决定'));const p=r.params;card.append(el('pre',JSON.stringify(p,null,2)));const base={request_id:r.requestId};let path,allow,deny;

function events(){

  source.onerror=()=>status('连接中断，正在重连…');source.onopen=()=>{status('已连接');refreshListSoon()};
}
$('pairform').onsubmit=async e=>{e.preventDefault();const button=$('pairButton');if(button.disabled)return;button.disabled=true;button.textContent='正在配对…';status('正在验证配对码…');let accepted=false;try{await api('/pair',{code:$('code').value.trim()});accepted=true;$('code').value='';status('配对成功，正在读取会话…');await boot()}catch(e){if(accepted&&$('app').hidden)status(`配对验证通过，但会话未能载入：${e.message}`);else status(e.name==='TimeoutError'?'配对请求超时，请检查手机与电脑的局域网连接后重试。':e.message)}finally{button.disabled=false;button.textContent='配对'}};
$('composer').onsubmit=async e=>{
  e.preventDefault();const text=$('input').value;if(busy||!thread||turn||!text.trim())return;
  const selected=thread.id;busy=true;updateComposer();
  try{
    await api('/api/codex/thread/resume',{threadId:selected,excludeTurns:true});
    const result=await api('/api/codex/turn/start',{threadId:selected,input:[{type:'text',text,text_elements:[]}]});
    if(thread?.id!==selected)return;
    turn=result.turn?.id;if($('input').value===text)$('input').value='';status('任务已发送');
  }catch(e){if(thread?.id!==selected)return;status(e.message);busy=false}
  finally{if(thread?.id===selected)updateComposer()}
};
$('stop').onclick=async()=>{
  if(!thread||!turn||stopPending)return;
  const selected=thread.id,selectedTurn=turn;stopPending=true;updateComposer();
  try{await api('/api/codex/turn/interrupt',{threadId:selected,turnId:selectedTurn});if(thread?.id===selected&&turn===selectedTurn)status('正在停止任务…')}
  catch(e){if(thread?.id===selected&&turn===selectedTurn){stopPending=false;updateComposer();status(e.message)}}
};
$('latest').onclick=()=>{viewingOlder=false;lastHistory='';$('latest').hidden=true;loadHistory().catch(e=>status(e.message))};$('older').onclick=()=>loadHistory(true).catch(e=>status(e.message));$('moreThreads').onclick=()=>list(true).catch(e=>status(e.message));$('refreshThreads').onclick=()=>list().catch(e=>status(e.message));function showRecents(){thread=null;turn=null;busy=false;stopPending=false;updateComposer();liveMessages.clear();$('live').replaceChildren();$('activityStatus').hidden=true;$('chat').hidden=true;$('recents').hidden=false;$('back').hidden=true;$('title').textContent='Lemma';window.scrollTo(0,0);list().catch(e=>status(e.message))}
$('back').onclick=()=>{if(window.history.state?.lemmaChat)window.history.back();else showRecents()};
if(window.lemmaMobilePopState)window.removeEventListener('popstate',window.lemmaMobilePopState);
window.lemmaMobilePopState=e=>{const target=e.state?.lemmaChat&&listRows.find(t=>t.id===e.state.threadId);if(target)openThread(target,false).catch(e=>status(e.message));else if(thread)showRecents()};
window.addEventListener('popstate',window.lemmaMobilePopState);
$('pairButton').disabled=false;
status('正在连接电脑…');
async function boot(){window.history.replaceState({lemmaList:true},'',location.pathname+location.search);await list();$('pair').hidden=true;$('app').hidden=false;events();status('已连接')}
setInterval(()=>{if(document.hidden||!thread)return;approvals().catch(e=>status(e.message));loadHistory().catch(e=>status(e.message))},3000);
setInterval(()=>{if(!document.hidden&&!thread&&!$('app').hidden&&!listLoading)list().catch(e=>status(e.message))},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){events();if(thread){loadHistory().catch(e=>status(e.message));approvals().catch(e=>status(e.message))}else refreshListSoon()}});boot().catch(e=>status(e.message));
</script></html>
