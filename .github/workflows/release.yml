name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version and tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package.json.' }
          git show-ref --verify "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Prepare build dependencies
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install libclang==18.1.1 --target .build-tools/libclang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBCLANG_PATH=$((Resolve-Path .build-tools/libclang/clang/native).Path)" >> $env:GITHUB_ENV
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
          node scripts/prepare-codex.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
      - run: bun run test
      - run: bun run validate-registry
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Package Windows installer
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Publish draft with verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "Codex Lemma $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md release-assets/*.exe release-assets/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false
