name: Registry

# MCP connector catalog only: no Rust build, so a registry pull request stays fast.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/registry.yml"
      - "registry/**"
      - "scripts/validate-mcp-registry.mjs"
      - "src/features/mcp/**"
  pull_request:
    paths:
      - ".github/workflows/registry.yml"
      - "registry/**"
      - "scripts/validate-mcp-registry.mjs"
      - "src/features/mcp/**"

permissions:
  contents: read

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate connector registry

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate registry
        run: bun run validate-registry

      - name: Catalog tests
        run: bunx vitest run src/features/mcp
